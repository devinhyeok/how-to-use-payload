version: "3"

services:
  postgres:
    image: postgres:15
    container_name: payload-postgres
    ports:
      - "5482:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: none
    env_file:
      - .env

volumes:
  postgres_data:
